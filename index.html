<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Ремонт — инструкции</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="app-shell catalog-page">
      <header class="catalog-heading">
        <h1>Ремонт</h1>
        <p>Выберите работу</p>
      </header>

      <label class="search">
        <img src="assets/icons/search.svg" alt="" />
        <input data-search type="search" placeholder="Найти инструкцию" aria-label="Найти инструкцию" />
      </label>

      <ul class="work-list" aria-label="Список ремонтных работ">
        <li>
          <a class="work-card" href="#" data-work-card data-coming-soon data-title="Сделать потолок">
            <img class="work-card__image" src="Ремонт/pictures/Работы/01-ceiling.png" alt="" />
            <span class="work-card__title">Сделать потолок</span>
            <img class="work-card__chevron" src="assets/icons/chevron.svg" alt="" />
          </a>
        </li>
        <li>
          <a class="work-card" href="#" data-work-card data-coming-soon data-title="Уложить плитку">
            <img class="work-card__image" src="Ремонт/pictures/Работы/02-tile.png" alt="" />
            <span class="work-card__title">Уложить плитку</span>
            <img class="work-card__chevron" src="assets/icons/chevron.svg" alt="" />
          </a>
        </li>
        <li>
          <a class="work-card" href="#" data-work-card data-coming-soon data-title="Уложить линолеум">
            <img class="work-card__image" src="Ремонт/pictures/Работы/03-linoleum.png" alt="" />
            <span class="work-card__title">Уложить линолеум</span>
            <img class="work-card__chevron" src="assets/icons/chevron.svg" alt="" />
          </a>
        </li>
        <li>
          <a class="work-card" href="#" data-work-card data-coming-soon data-title="Покрасить стены">
            <img class="work-card__image" src="Ремонт/pictures/Работы/04-paint-walls.png" alt="" />
            <span class="work-card__title">Покрасить стены</span>
            <img class="work-card__chevron" src="assets/icons/chevron.svg" alt="" />
          </a>
        </li>
        <li>
          <a class="work-card" href="#" data-work-card data-coming-soon data-title="Отделать откосы">
            <img class="work-card__image" src="Ремонт/pictures/Работы/05-window-slopes.png" alt="" />
            <span class="work-card__title">Отделать откосы</span>
            <img class="work-card__chevron" src="assets/icons/chevron.svg" alt="" />
          </a>
        </li>
        <li>
          <a class="work-card" href="#" data-work-card data-coming-soon data-title="Установить двери">
            <img class="work-card__image" src="Ремонт/pictures/Работы/06-doors.png" alt="" />
            <span class="work-card__title">Установить двери</span>
            <img class="work-card__chevron" src="assets/icons/chevron.svg" alt="" />
          </a>
        </li>
        <li>
          <a class="work-card" href="lesson-1.html" data-work-card data-title="Установить розетки">
            <img class="work-card__image" src="Ремонт/pictures/Работы/07-sockets.png" alt="" />
            <span class="work-card__title">Установить розетки</span>
            <img class="work-card__chevron" src="assets/icons/chevron.svg" alt="" />
          </a>
        </li>
        <li>
          <a class="work-card" href="#" data-work-card data-coming-soon data-title="Установить светильники">
            <img class="work-card__image" src="Ремонт/pictures/Работы/08-light-fixtures.png" alt="" />
            <span class="work-card__title">Установить светильники</span>
            <img class="work-card__chevron" src="assets/icons/chevron.svg" alt="" />
          </a>
        </li>
        <li>
          <a class="work-card" href="#" data-work-card data-coming-soon data-title="Установить кондиционер">
            <img class="work-card__image" src="Ремонт/pictures/Работы/09-air-conditioner.png" alt="" />
            <span class="work-card__title">Установить кондиционер</span>
            <img class="work-card__chevron" src="assets/icons/chevron.svg" alt="" />
          </a>
        </li>
      </ul>

      <p class="empty-state" data-empty-state>Ничего не найдено</p>
    </main>
    <div class="toast" role="status" aria-live="polite" data-toast>Инструкция скоро появится</div>
    <script src="js/app.js"></script>
  </body>
</html>
